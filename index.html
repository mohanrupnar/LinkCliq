<!DOCTYPE ahtml>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> LinkCliq - Your Social Network</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-50 transition-colors duration-200">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <!-- Logo and Profile -->
            <div class="flex items-center space-x-2 w-1/4" data-tooltip=" LinkCliq Home">
                <i class="fas fa-user-circle text-2xl text-gray-500 -ml-3"></i>
                <h1 id="home-btn" class="text-3xl font-bold text-gray-800 transition-colors duration-200 cursor-pointer hidden md:block"> LinkCliq</h1>
            </div>
            
            <!-- Search Bar -->
            <div class="relative flex-grow mx-4">
                <input type="text" id="main-search-input" placeholder="Search friends, pages, and more" class="w-full pl-10 pr-4 py-2 rounded-full bg-gray-100 border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors duration-200">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center space-x-4 w-1/4 justify-end">
                <button id="explore-btn" class="text-gray-500 hover:text-gray-800 transition-colors duration-200" data-tooltip="Explore Pages">
                    <i class="fas fa-compass text-2xl"></i>
                </button>
                <button id="message-btn" class="text-gray-500 hover:text-gray-800 transition-colors duration-200" data-tooltip="Messenger">
                    <i class="fas fa-comment-alt text-2xl"></i>
                </button>
                <button id="create-post-btn" class="text-blue-600 font-semibold py-2 px-4 rounded-full transition-colors duration-200" data-tooltip="Create a Post">
                    <i class="fas fa-plus-square text-2xl"></i>
                </button>
                <button id="settings-btn" class="text-gray-500 hover:text-gray-800 transition-colors duration-200" data-tooltip="Settings">
                    <i class="fas fa-bars text-2xl"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto p-4 md:p-6 lg:p-8 flex justify-center">
        <div class="w-full max-w-lg space-y-6" id="posts-container">
            <!-- Posts will be dynamically inserted here -->
        </div>
    </main>

    <!-- Search Results Modal -->
    <div id="search-results-modal" class="modal hidden fixed inset-0 z-50 flex items-start justify-center p-4 pt-20">
        <div class="modal-content rounded-lg shadow-xl p-6 w-full max-w-lg transition-colors duration-300">
            <div class="flex justify-between items-center pb-4 mb-4 border-b">
                <h3 class="text-xl font-bold text-gray-800 transition-colors duration-200">Search Results</h3>
                <button id="close-search-results-modal" class="text-gray-500 hover:text-gray-800">&times;</button>
            </div>
            <div class="space-y-4" id="search-results-list">
                <!-- User profiles will be dynamically inserted here -->
            </div>
        </div>
    </div>


    <!-- Post Creation Modal -->
    <div id="create-post-modal" class="modal hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="modal-content rounded-lg shadow-xl p-6 w-full max-w-lg transition-colors duration-300">
            <div class="flex justify-between items-center pb-4 mb-4 border-b">
                <h3 class="text-xl font-bold text-gray-800 transition-colors duration-200">Create a New Post</h3>
                <button id="close-post-modal" class="text-gray-500 hover:text-gray-800">&times;</button>
            </div>
            <textarea id="post-content-input" rows="5" class="w-full p-3 mb-4 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors duration-200" placeholder="What's on your mind?"></textarea>
            <input type="text" id="image-url-input" class="w-full p-3 mb-4 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors duration-200" placeholder="Paste an image URL (optional)">
            <div class="flex justify-end space-x-2">
                <button id="submit-post-btn" class="bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-blue-700 transition-colors duration-200">
                    Post
                </button>
            </div>
        </div>
    </div>

    <!-- Explore Pages Modal -->
    <div id="explore-modal" class="modal hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="modal-content rounded-lg shadow-xl p-6 w-full max-w-md transition-colors duration-300">
            <div class="flex justify-between items-center pb-4 mb-4 border-b">
                <h3 class="text-xl font-bold text-gray-800 transition-colors duration-200">Explore Pages</h3>
                <button id="close-explore-modal" class="text-gray-500 hover:text-gray-800">&times;</button>
            </div>
            <div class="relative mb-4">
                <input type="text" id="page-search-input" class="w-full p-3 pl-10 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors duration-200" placeholder="Search pages">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
            </div>
            <div class="space-y-4" id="pages-list">
                <!-- Pages will be dynamically inserted here -->
            </div>
            <div class="mt-4 pt-4 border-t">
                <button id="create-page-btn" class="w-full flex items-center justify-center space-x-2 p-3 rounded-lg text-blue-600 font-semibold hover:bg-blue-50 dark:hover:bg-blue-900 transition-colors duration-200">
                    <i class="fas fa-plus-circle"></i>
                    <span>Create New Page</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Create Page Modal -->
    <div id="create-page-modal" class="modal hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="modal-content rounded-lg shadow-xl p-6 w-full max-w-lg transition-colors duration-300">
            <div class="flex justify-between items-center pb-4 mb-4 border-b">
                <h3 class="text-xl font-bold text-gray-800 transition-colors duration-200">Create a New Page</h3>
                <button id="close-create-page-modal" class="text-gray-500 hover:text-gray-800">&times;</button>
            </div>
            <input type="text" id="new-page-name-input" class="w-full p-3 mb-4 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors duration-200" placeholder="Enter page name">
            <textarea id="new-page-description-input" rows="3" class="w-full p-3 mb-4 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors duration-200" placeholder="Enter a short description (optional)"></textarea>
            <div class="flex justify-end space-x-2">
                <button id="submit-create-page-btn" class="bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-blue-700 transition-colors duration-200">
                    Create Page
                </button>
            </div>
        </div>
    </div>


    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="modal-content rounded-lg shadow-xl p-6 w-full max-w-md transition-colors duration-300">
            <div class="flex justify-between items-center pb-4 mb-4 border-b">
                <h3 class="text-xl font-bold text-gray-800 transition-colors duration-200">Settings</h3>
                <button id="close-settings-modal" class="text-gray-500 hover:text-gray-800">&times;</button>
            </div>
            <div class="space-y-4">
                <button id="account-details-btn" class="w-full flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">
                    <i class="fas fa-user-circle text-xl text-gray-500"></i>
                    <span class="font-semibold text-gray-700 dark:text-gray-300">Account Details</span>
                </button>
                <button id="recent-activity-btn" class="w-full flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">
                    <i class="fas fa-clock text-xl text-gray-500"></i>
                    <span class="font-semibold text-gray-700 dark:text-gray-300">Recent Activity</span>
                </button>
                <button id="privacy-btn" class="w-full flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">
                    <i class="fas fa-user-lock text-xl text-gray-500"></i>
                    <span class="font-semibold text-gray-700 dark:text-gray-300">Privacy</span>
                </button>
                <div class="w-full h-px bg-gray-200 dark:bg-gray-600 my-4"></div>
                <button id="saved-btn" class="w-full flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">
                    <i class="fas fa-bookmark text-xl text-gray-500"></i>
                    <span class="font-semibold text-gray-700 dark:text-gray-300">Saved</span>
                </button>
                <button id="blocked-btn" class="w-full flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">
                    <i class="fas fa-ban text-xl text-gray-500"></i>
                    <span class="font-semibold text-gray-700 dark:text-gray-300">Blocked Accounts</span>
                </button>
                <button id="close-friends-btn" class="w-full flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">
                    <i class="fas fa-users text-xl text-gray-500"></i>
                    <span class="font-semibold text-gray-700 dark:text-gray-300">Close Friends</span>
                </button>
                <div class="w-full h-px bg-gray-200 dark:bg-gray-600 my-4"></div>
                <div class="flex justify-between items-center p-3">
                    <span class="text-gray-700 transition-colors duration-200 font-semibold dark:text-gray-300">Dark Mode</span>
                    <button id="dark-mode-toggle" class="bg-gray-200 w-14 h-8 rounded-full flex items-center p-1 transition-colors duration-200">
                        <div class="bg-white w-6 h-6 rounded-full shadow-md transform transition-transform duration-200"></div>
                    </button>
                </div>
                <div class="w-full h-px bg-gray-200 dark:bg-gray-600 my-4"></div>
                <button id="logout-btn" class="w-full flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">
                    <i class="fas fa-sign-out-alt text-xl text-red-500"></i>
                    <span class="font-semibold text-red-500">Log Out</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Chat Modal -->
    <div id="chat-modal" class="modal hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="modal-content rounded-lg shadow-xl p-6 w-full max-w-md transition-colors duration-300 flex flex-col h-[70vh]">
            <div class="flex justify-between items-center pb-4 mb-4 border-b">
                <h3 class="text-xl font-bold text-gray-800 transition-colors duration-200">Messages</h3>
                <button id="close-chat-modal" class="text-gray-500 hover:text-gray-800">&times;</button>
            </div>
            <div class="relative mb-4">
                <input type="text" id="chat-search-input" class="w-full p-3 pl-10 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors duration-200" placeholder="Search friends">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
            </div>
            <div id="chat-list" class="flex-grow overflow-y-auto space-y-2">
                <!-- Chat list items will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <!-- Custom Alert/Message Modal (for errors or success) -->
    <div id="custom-alert-modal" class="modal hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="modal-content rounded-lg shadow-xl p-6 w-full max-w-sm text-center">
            <p id="alert-message" class="text-lg font-semibold text-gray-800"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
